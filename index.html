<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hospital Tycoon JS</title>
  <style>
    :root {
      --panel: #1f4f86;
      --panel-dark: #163a63;
      --panel-light: #3f7cc0;
      --text: #f4f1e6;
      --accent: #f2c94c;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #2b3a4a; color: var(--text); font: 14px/1.3 system-ui, sans-serif; }
    canvas { display: block; }
    .bar {
      position: fixed; left: 8px; right: 8px; margin-inline: auto; width: fit-content;
      display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: center;
      padding: 6px 10px; background: var(--panel); border: 2px solid var(--panel-light);
      box-shadow: 0 0 0 2px var(--panel-dark), 0 6px 20px rgba(0,0,0,.35); border-radius: 8px;
    }
    #top { top: 8px; }
    #bottom { bottom: 8px; }
    .stat { padding: 2px 10px; background: var(--panel-dark); border-radius: 4px; white-space: nowrap; }
    .stat b { color: var(--accent); font-variant-numeric: tabular-nums; }
    #money.neg { color: #ff7b6b; }
    button {
      font: inherit; color: var(--text); background: var(--panel-light); border: 0; border-radius: 5px;
      padding: 7px 12px; cursor: pointer; box-shadow: inset 0 -3px 0 rgba(0,0,0,.25);
    }
    button:hover { filter: brightness(1.15); }
    button.active { background: var(--accent); color: #222; }
    .sep { width: 2px; align-self: stretch; background: var(--panel-dark); }
    #log {
      position: fixed; left: 8px; bottom: 70px; width: min(360px, calc(100vw - 16px));
      font-size: 13px; pointer-events: none;
    }
    #log div { background: rgba(22,58,99,.85); margin-top: 4px; padding: 4px 8px; border-radius: 4px; }
    #log div:not(:first-child) { opacity: .6; }
    #hint { position: fixed; right: 8px; bottom: 70px; background: rgba(22,58,99,.85); padding: 4px 8px; border-radius: 4px; }
    #hint:empty { display: none; }
    #tooltip {
      position: fixed; display: none; pointer-events: none; background: #fffbe8; color: #222;
      padding: 6px 8px; border-radius: 4px; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.4);
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div class="bar" id="top">
    <span class="stat">Bank <b id="money"></b></span>
    <span class="stat">Reputation <b id="rep"></b></span>
    <span class="stat">Date <b id="date"></b></span>
    <span class="stat">Cured <b id="treated"></b></span>
    <span class="stat">Patients <b id="patients"></b></span>
  </div>

  <div class="bar" id="bottom">
    <button data-tool="reception" title="Click a corridor tile to place ($400)">Reception Desk</button>
    <button data-tool="gp" title="Drag out a rectangle, min 3x3">GP's Office</button>
    <span class="sep"></span>
    <button data-hire="receptionist">Hire Receptionist</button>
    <button data-hire="doctor">Hire Doctor</button>
    <span class="sep"></span>
    <button data-speed="0">❚❚</button>
    <button data-speed="1">▶</button>
    <button data-speed="3">▶▶</button>
  </div>

  <div id="log"></div>
  <div id="hint"></div>
  <div id="tooltip"></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
